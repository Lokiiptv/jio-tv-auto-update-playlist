name: Generate YuppTV M3U Playlist

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Generate YuppTV M3U playlist
        id: generate
        run: |
          python generate_yupptv.py

      - name: Verify playlist
        id: check
        run: |
          if [ -f "./yupptvfast.m3u" ] && [ -s "./yupptvfast.m3u" ]; then
            echo "playlist_exists=true" >> $GITHUB_OUTPUT
            CHANNELS=$(grep -c "^#EXTINF" ./yupptvfast.m3u || echo "0")
            echo "Channels: $CHANNELS"
          else
            echo "playlist_exists=false" >> $GITHUB_OUTPUT
            echo "Playlist missing or empty!"
            exit 1
          fi

      - name: Upload playlist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yupptv-playlist
          path: yupptvfast.m3u
          retention-days: 30

      - name: Commit and push playlist
        if: steps.check.outputs.playlist_exists == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add yupptvfast.m3u
          git commit -m "Update YuppTV playlist [skip ci]" || echo "No changes to commit"
          git push
