name: Fetch M3U Playlist

on:
  schedule:
    - cron: '*/30 * * * *'    
  workflow_dispatch:          

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fetch script
        run: python fetch_playlist.py   # make sure the script is named this
      - name: Commit and push if changed
        run: |
          git config user.name "iptv-bot[bot]"
          git config user.email "84861620+iptv-bot[bot]@users.noreply.github.com"
          git add mixiptv.m3u
          git diff --staged --quiet || git commit -m "Auto-update playlist $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
