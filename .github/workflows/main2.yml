name: Auto Update Playlist

on:
  schedule:
    - cron: "*/30 * * * *"   # adjust to your actual schedule
  workflow_dispatch:

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python (if using Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies (if any)
        run: |
          # Install any required packages
          pip install requests  # example

      - name: Generate playlist
        run: |
          # Run your actual script
          python generate_playlist.py > jtv2.m3u
          # OR if you have a bash script:
          # ./generate_playlist.sh > jtv2.m3u

      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add jtv2.m3u
          git commit -m "Auto-update playlists: $(date -u)" || echo "No changes to commit"

      - name: Pull latest before pushing
        run: git pull --rebase origin main

      - name: Push changes
        run: git push origin main
