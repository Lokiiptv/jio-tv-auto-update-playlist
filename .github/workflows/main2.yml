name: Auto Update Playlist

on:
  schedule:
    - cron: "*/30 * * * *"   # adjust to your actual schedule
  workflow_dispatch:

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        run: |
          echo "Add any setup steps here (Node/Python/etc.) if your script needs them"

      - name: Generate playlist
        run: |
          # Replace this with whatever actually produces jtv2.m3u
          echo "Generating jtv2.m3u..."
          # e.g. python generate_playlist.py > jtv2.m3u

      - name: Set git identity
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@example.com"

      - name: Commit changes
        run: |
          git add jtv2.m3u
          git commit -m "Auto-update playlists: $(date -u)" || echo "No changes to commit"

      - name: Pull latest before pushing
        run: git pull --rebase origin main

      - name: Push changes
        run: git push origin main
